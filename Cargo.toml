[package]
name = "boothop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "boothop"
path = "src/main.rs"
test = false
bench = false

[dependencies]
anyhow = "=1.0.104"
clap = "=4.6.8"
ctrlc = "=3.5.2"
ext4-view = { version = "=1.0.0", features = ["std"] }
ferrosys = { version = "=0.8.0", default-features = false, features = ["btrfs", "zlib", "lzo", "zstd"] }
flate2 = "=1.1.11"
fstool = { version = "=0.5.4", default-features = false, features = ["std", "xfs"] }
ntfs = "=0.4.0"
regf-rs = "=0.1.1"
self-replace = "=1.5.1"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
shell-words = "=1.1.1"
tar = "=0.4.46"
tempfile = "=3.27.0"
ureq = "=3.5.2"
uuid = "=1.29.3"
zip = { version = "=9.6.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Shutdown", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Environment", "Win32_System_WindowsProgramming", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Security_Authorization"] }

[target."cfg(unix)".dependencies]
libc = "=0.2.191"
